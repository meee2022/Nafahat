name: Build Android Production AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate release
        run: npm test

      - name: Install EAS CLI
        run: npm install --global eas-cli@22.3.0

      - name: Build signed production AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile production --local --non-interactive --output ./nafahat-production.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nafahat-android-production-aab
          path: nafahat-production.aab
          if-no-files-found: error
          retention-days: 14
